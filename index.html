<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sector Glow: Cyber-Extract</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
    
    body { margin: 0; background: #020202; color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    .ui-layer { position: absolute; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem; z-index: 10; }
    .interactive { pointer-events: auto; }
    .glass { background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 0, 0, 0.2); box-shadow: 0 0 20px rgba(0,0,0,0.5); border-radius: 0.5rem; }
    .neon-text { text-shadow: 0 0 10px rgba(255, 50, 50, 0.8), 0 0 20px rgba(255, 0, 0, 0.4); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .scanlines::before {
      content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2; background-size: 100% 4px, 3px 100%; pointer-events: none;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    .glitch-hover:hover { animation: glitch 0.2s infinite; }
  </style>
</head>
<body class="scanlines">

<div class="ui-layer">
  <div class="flex justify-between items-start">
    <div class="glass p-4 border-l-4 border-l-red-600">
      <h1 class="text-xl font-black italic uppercase tracking-tighter text-red-500">Sector <span class="text-white neon-text">Glow</span></h1>
      <div class="flex gap-4 mt-2">
        <div>
          <p class="text-[8px] mono text-gray-500 uppercase font-bold">Location</p>
          <p id="level-txt" class="text-xs mono text-white">Grid_01</p>
        </div>
        <div>
          <p class="text-[8px] mono text-gray-500 uppercase font-bold">Integrity</p>
          <p id="moves-txt" class="text-xs mono text-red-400">000 MOVES</p>
        </div>
      </div>
    </div>
    <div class="interactive flex flex-col gap-2">
      <button onclick="resetLevel()" class="glass p-3 hover:bg-red-950 transition-all border-red-900/40 glitch-hover">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
      </button>
      <button onclick="clearProgress()" class="glass p-3 hover:bg-gray-800 transition-all border-white/10 text-[8px] text-gray-500 mono uppercase">
        Reset All
      </button>
    </div>
  </div>

  <div class="flex justify-center mb-4">
    <div class="glass px-6 py-2 border-t-2 border-t-red-600/50">
      <p id="hint-txt" class="text-[9px] mono text-red-500 animate-pulse">SYSTEM: CLEAR PATH FOR CORE UNIT</p>
    </div>
  </div>
</div>

<div id="win-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl hidden">
  <div class="glass p-12 text-center max-w-sm border-2 border-red-600 shadow-[0_0_50px_rgba(220,38,38,0.3)]">
    <div class="mb-6">
      <div class="w-16 h-16 border-4 border-red-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <h2 id="win-title" class="text-4xl font-black mb-1 italic uppercase tracking-tighter neon-text">EXTRACTED</h2>
      <p class="mono text-red-500 text-[10px] tracking-widest font-bold">ENCRYPTION BYPASSED</p>
    </div>
    <div class="mono text-xs text-gray-400 mb-8 p-4 bg-red-950/20 rounded">
      Session Metrics: <span id="final-moves" class="text-white">0</span> operations
    </div>
    <button id="next-level-btn" onclick="handleNextLevel()"
      class="w-full bg-red-600 py-4 rounded-sm font-black text-white hover:bg-red-500 active:scale-95 transition-all interactive shadow-[0_0_30px_rgba(220,38,38,0.5)] tracking-widest">
      NEXT SECTOR
    </button>
  </div>
</div>

<div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

<script>
  // --- AIRY (FFF) ORGANIC AUDIO SYSTEM ---
  const audio = {
    ctx: null,
    noiseBuffer: null,
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.noiseBuffer = this.createNoiseBuffer();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    createNoiseBuffer() {
      const size = 2 * this.ctx.sampleRate;
      const buffer = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      return buffer;
    },
    play(type) {
      this.init();
      const now = this.ctx.currentTime;
      
      const source = this.ctx.createBufferSource();
      source.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();

      switch(type) {
        case 'move': // Smooth Airy Whoosh
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(3500, now + 0.2);
          filter.Q.value = 4;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.08, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(); source.stop(now + 0.2);
          break;

        case 'select': // Subtle Airy Swish
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(2500, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.04, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(); source.stop(now + 0.4);
          break;

        case 'win': // Cinematic Airy Swell (fff)
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(300, now);
          filter.frequency.exponentialRampToValueAtTime(9000, now + 4);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.12, now + 2.5);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(); source.stop(now + 4.5);
          break;

        case 'click': // Soft Airy Pop
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(5500, now);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(); source.stop(now + 0.06);
          break;
      }
    }
  };

  const GRID_SIZE = 6;
  const CELL_SIZE = 2.4;
  const SHRINK = 0.88;
  const RED_EXIT_ROW = 2;

  let moveCount = 0;
  const levels = [
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:1,l:2,o:'v',c:0x44ffaa}, {x:4,y:0,l:3,o:'v',c:0x44aaff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:2,l:2,o:'v',c:0xaa44ff}, {x:3,y:1,l:2,o:'v',c:0xffaa44}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:0,l:3,o:'v',c:0xff44aa}, {x:3,y:0,l:2,o:'h',c:0x4444ff}, {x:3,y:2,l:2,o:'v',c:0x00ffaa}, {x:5,y:1,l:3,o:'v',c:0x44aaff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:1,l:2,o:'v',c:0x00ffaa}, {x:3,y:2,l:2,o:'v',c:0xffaa44}, {x:4,y:1,l:2,o:'v',c:0x44aaff}, {x:5,y:0,l:3,o:'v',c:0xff00aa}, {x:0,y:4,l:2,o:'h',c:0xaa44ff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:0,l:3,o:'v',c:0x44ffaa}, {x:3,y:0,l:2,o:'v',c:0x4444ff}, {x:4,y:0,l:2,o:'h',c:0xff8844}, {x:5,y:2,l:3,o:'v',c:0x00ffff}, {x:0,y:0,l:2,o:'h',c:0xaa44ff}, {x:1,y:4,l:2,o:'v',c:0xff44aa}],
    [{x:1,y:2,l:2,o:'h',c:0xff2222}, {x:0,y:0,l:3,o:'v',c:0x44aaff}, {x:3,y:0,l:3,o:'v',c:0x44ffaa}, {x:4,y:0,l:2,o:'h',c:0xffaa44}, {x:4,y:1,l:2,o:'v',c:0x00ffff}, {x:5,y:1,l:2,o:'v',c:0xff00aa}, {x:1,y:4,l:3,o:'h',c:0xaa44ff}, {x:0,y:4,l:2,o:'v',c:0x4444ff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:0,l:2,o:'v',c:0xff8844}, {x:3,y:1,l:2,o:'v',c:0xaa44ff}, {x:4,y:2,l:2,o:'v',c:0x44ffaa}, {x:5,y:0,l:3,o:'v',c:0x4444ff}, {x:2,y:3,l:2,o:'h',c:0x44aaff}, {x:0,y:0,l:2,o:'h',c:0x00ffaa}, {x:0,y:4,l:2,o:'v',c:0xaa44ff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:0,l:3,o:'v',c:0x00ffff}, {x:3,y:1,l:3,o:'v',c:0xffaa44}, {x:4,y:2,l:3,o:'v',c:0xff44aa}, {x:0,y:0,l:2,o:'h',c:0x4444ff}, {x:0,y:4,l:2,o:'v',c:0x44aaff}, {x:3,y:0,l:2,o:'h',c:0x00ffaa}, {x:2,y:4,l:2,o:'h',c:0xaa44ff}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:0,l:3,o:'v',c:0x44aaff}, {x:3,y:0,l:2,o:'v',c:0x44ffaa}, {x:4,y:0,l:2,o:'h',c:0xffaa44}, {x:5,y:1,l:3,o:'v',c:0x00ffff}, {x:0,y:0,l:2,o:'v',c:0xff00aa}, {x:1,y:0,l:2,o:'v',c:0x4444ff}, {x:2,y:4,l:2,o:'h',c:0xaa44ff}, {x:3,y:3,l:2,o:'v',c:0x00ffaa}, {x:4,y:5,l:2,o:'h',c:0xff8844}],
    [{x:0,y:2,l:2,o:'h',c:0xff2222}, {x:2,y:1,l:3,o:'v',c:0xff44aa}, {x:3,y:1,l:3,o:'v',c:0x4444ff}, {x:4,y:1,l:3,o:'v',c:0x00ffaa}, {x:2,y:0,l:3,o:'h',c:0x44aaff}, {x:2,y:4,l:3,o:'h',c:0x44ffaa}, {x:0,y:0,l:2,o:'v',c:0xaa44ff}, {x:1,y:0,l:2,o:'v',c:0xffaa44}, {x:5,y:0,l:2,o:'v',c:0x00ffff}, {x:0,y:4,l:2,o:'v',c:0xff00aa}, {x:5,y:4,l:2,o:'v',c:0xff8844}, {x:1,y:4,l:2,o:'h',c:0xaa44ff}]
  ];

  let scene, camera, renderer, raycaster, mouse;
  let vehiclesData = [], vehicleGroup = new THREE.Group();
  let currentLevel = parseInt(localStorage.getItem('sector_glow_level')) || 0;
  let selected = null, isOrbiting = false, isWon = false, winTime = 0;
  let winBeam, winGlow, winLight, exitBase, particles;

  let targetTheta = Math.PI/4, targetPhi = Math.PI/3.2, targetRadius = 45;
  let curTheta = targetTheta + 1, curPhi = targetPhi, curRadius = 150;
  const camTarget = new THREE.Vector3(6, 0, 6);

  let lastMouse = { x: 0, y: 0 };
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const intersectPt = new THREE.Vector3();
  const dragOffset = new THREE.Vector3();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020202);
    scene.fog = new THREE.Fog(0x020202, 20, 120);

    camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const p1 = new THREE.PointLight(0xff0000, 1, 50); p1.position.set(20, 10, 20); scene.add(p1);
    const p2 = new THREE.PointLight(0x00ffaa, 0.5, 50); p2.position.set(-10, 10, -10); scene.add(p2);

    createBoard();
    createVictoryVFX();
    createBackground();

    scene.add(vehicleGroup);
    loadLevel(currentLevel);

    window.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchstart', (e) => onDown(e.touches[0]), {passive:false});
    window.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e.touches[0]); }, {passive:false});
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', onResize);

    animate();
  }

  function createBackground() {
    const geo = new THREE.BufferGeometry();
    const count = 1500;
    const pos = new Float32Array(count * 3);
    for(let i=0; i<count*3; i++) pos[i] = (Math.random()-0.5) * 200;
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    particles = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x444444, size: 0.15 }));
    scene.add(particles);
  }

  function createBoard() {
    const b = GRID_SIZE * CELL_SIZE;
    const f = new THREE.Mesh(
      new THREE.BoxGeometry(b + 2, 0.4, b + 2),
      new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8, metalness: 0.2 })
    );
    f.position.set(b/2 - 0.5, -0.2, b/2 - 0.5);
    scene.add(f);

    for (let i=0; i<=GRID_SIZE; i++) {
      const mat = new THREE.MeshBasicMaterial({color: 0x220000});
      const h = new THREE.Mesh(new THREE.BoxGeometry(b, 0.02, 0.02), mat);
      h.position.set(b/2 - 0.5, 0.01, i * CELL_SIZE - 1.2);
      scene.add(h);
      const v = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, b), mat);
      v.position.set(i * CELL_SIZE - 1.2, 0.01, b/2 - 0.5);
      scene.add(v);
    }

    exitBase = new THREE.Mesh(
      new THREE.BoxGeometry(CELL_SIZE - 0.4, 0.05, CELL_SIZE - 0.4),
      new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 5 })
    );
    exitBase.position.set(b + 0.5, 0, 2 * CELL_SIZE + (CELL_SIZE/2 - 1.2));
    scene.add(exitBase);
  }

  function createVictoryVFX() {
    winBeam = new THREE.Mesh(
      new THREE.CylinderGeometry(CELL_SIZE/3, CELL_SIZE/2, 200, 16, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
    );
    winBeam.position.set(exitBase.position.x, 100, exitBase.position.z);
    scene.add(winBeam);

    winGlow = new THREE.Mesh(
      new THREE.SphereGeometry(2, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
    );
    winGlow.position.copy(exitBase.position);
    scene.add(winGlow);

    winLight = new THREE.PointLight(0xff0000, 0, 50);
    winLight.position.copy(exitBase.position).y += 2;
    scene.add(winLight);
  }

  function createVehicleMesh(v) {
    const group = new THREE.Group();
    const w = (v.o === 'h' ? v.l * CELL_SIZE : CELL_SIZE) * SHRINK;
    const d = (v.o === 'h' ? CELL_SIZE : v.l * CELL_SIZE) * SHRINK;
    const isRed = v.c === 0xff2222;

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, 0.8, d),
      new THREE.MeshStandardMaterial({ color: v.c, roughness: 0.1, metalness: 0.8, emissive: v.c, emissiveIntensity: isRed ? 0.8 : 0.2 })
    );
    body.position.y = 0.4;
    group.add(body);

    const detail = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.9, 0.1, d * 0.9),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })
    );
    detail.position.y = 0.85;
    group.add(detail);

    if (isRed) {
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      core.position.y = 1;
      group.add(core);
    }
    return group;
  }

  function loadLevel(idx) {
    isWon = false; moveCount = 0;
    localStorage.setItem('sector_glow_level', idx);
    while (vehicleGroup.children.length > 0) vehicleGroup.remove(vehicleGroup.children[0]);

    const data = levels[idx];
    vehiclesData = data.map((d, i) => {
      const mesh = createVehicleMesh(d);
      const v = { ...d, mesh, id: i };
      updateMesh(v);
      vehicleGroup.add(mesh);
      return v;
    });

    currentLevel = idx;
    document.getElementById('level-txt').innerText = `Grid_${(idx+1).toString().padStart(2, '0')}`;
    document.getElementById('moves-txt').innerText = `000 MOVES`;
    document.getElementById('win-modal').classList.add('hidden');
    winBeam.material.opacity = 0; winGlow.material.opacity = 0; winLight.intensity = 0;
  }

  function updateMesh(v) {
    const xO = v.o === 'h' ? (v.l * CELL_SIZE)/2 - 1.2 : CELL_SIZE/2 - 1.2;
    const zO = v.o === 'v' ? (v.l * CELL_SIZE)/2 - 1.2 : CELL_SIZE/2 - 1.2;
    v.mesh.position.set(v.x * CELL_SIZE + xO, 0, v.y * CELL_SIZE + zO);
  }

  function moveVehicle(v, nx, ny) {
    if (isWon) return;
    const isRed = v.c === 0xff2222;
    const maxX = GRID_SIZE - (v.o === 'h' ? v.l : 1);
    const maxY = GRID_SIZE - (v.o === 'v' ? v.l : 1);
    const tx = Math.max(0, Math.min(nx, isRed ? GRID_SIZE : maxX));
    const ty = Math.max(0, Math.min(ny, maxY));

    if (tx === v.x && ty === v.y) return;
    if (v.o === 'h' && ty !== v.y) return;
    if (v.o === 'v' && tx !== v.x) return;

    const stepX = Math.sign(tx - v.x);
    const stepY = Math.sign(ty - v.y);
    let currX = v.x, currY = v.y;
    
    while (currX !== tx || currY !== ty) {
      let nextX = currX + stepX, nextY = currY + stepY;
      if (isRed && nextX === GRID_SIZE && v.y === RED_EXIT_ROW) {
        let blocked = false;
        for (let other of vehiclesData) {
           if(other.id === v.id) continue;
           for(let j=0; j<other.l; j++) {
             const ox = other.o === 'h' ? other.x + j : other.x;
             const oy = other.o === 'h' ? other.y : other.y + j;
             if (ox >= GRID_SIZE && oy === RED_EXIT_ROW) blocked = true;
           }
        }
        if (!blocked) { v.x = GRID_SIZE; updateMesh(v); triggerWin(); return; }
        break;
      }
      if (checkCollision(v, nextX, nextY)) break;
      currX = nextX; currY = nextY;
      moveCount++;
      audio.play('move'); 
      document.getElementById('moves-txt').innerText = `${moveCount.toString().padStart(3, '0')} MOVES`;
    }
    v.x = currX; v.y = currY;
    updateMesh(v);
  }

  function checkCollision(v, nx, ny) {
    const cells = [];
    for (let i=0; i<v.l; i++) cells.push(v.o === 'h' ? {x: nx+i, y: ny} : {x: nx, y: ny+i});
    for (let other of vehiclesData) {
      if (other.id === v.id) continue;
      for (let j=0; j<other.l; j++) {
        const ox = other.o === 'h' ? other.x + j : other.x;
        const oy = other.o === 'h' ? other.y : other.y + j;
        for (let c of cells) if (c.x === ox && c.y === oy) return true;
      }
    }
    return false;
  }

  function triggerWin() {
    isWon = true; winTime = Date.now();
    audio.play('win');
    document.getElementById('final-moves').innerText = moveCount;
    setTimeout(() => document.getElementById('win-modal').classList.remove('hidden'), 3500);
  }

  function onDown(e) {
    const cX = e.clientX, cY = e.clientY;
    mouse.x = (cX / window.innerWidth) * 2 - 1;
    mouse.y = -(cY / window.innerHeight) * 2 + 1;
    lastMouse = { x: cX, y: cY };

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(vehicleGroup.children, true);
    if (hits.length > 0 && !isWon) {
      let o = hits[0].object;
      while (o.parent && o.parent !== vehicleGroup) o = o.parent;
      selected = vehiclesData.find(v => v.mesh === o);
      if (raycaster.ray.intersectPlane(ground, intersectPt)) {
        dragOffset.copy(intersectPt).sub(selected.mesh.position);
        audio.play('select');
      }
    } else {
      isOrbiting = true;
    }
  }

  function onMove(e) {
    const cX = e.clientX, cY = e.clientY;
    const dx = cX - lastMouse.x, dy = cY - lastMouse.y;
    lastMouse = { x: cX, y: cY };

    if (isOrbiting) {
      targetTheta += dx * 0.01;
      targetPhi = Math.max(0.2, Math.min(Math.PI/2.2, targetPhi - dy * 0.01));
    } else if (selected && !isWon) {
      mouse.x = (cX / window.innerWidth) * 2 - 1;
      mouse.y = -(cY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      if (raycaster.ray.intersectPlane(ground, intersectPt)) {
        const t = intersectPt.clone().sub(dragOffset);
        const off = (selected.l * CELL_SIZE)/2 - 1.2;
        if (selected.o === 'h') moveVehicle(selected, Math.round((t.x - off) / CELL_SIZE), selected.y);
        else moveVehicle(selected, selected.x, Math.round((t.z - off) / CELL_SIZE));
      }
    }
  }

  function onUp() { selected = null; isOrbiting = false; }
  function onResize() { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
  function resetLevel() { audio.play('click'); loadLevel(currentLevel); }
  function clearProgress() { audio.play('click'); localStorage.clear(); loadLevel(0); }
  function handleNextLevel() { audio.play('click'); loadLevel((currentLevel + 1) % levels.length); }

  function animate() {
    requestAnimationFrame(animate);
    curTheta += (targetTheta - curTheta) * 0.08;
    curPhi += (targetPhi - curPhi) * 0.08;
    curRadius += (targetRadius - curRadius) * 0.05;

    camera.position.x = camTarget.x + curRadius * Math.sin(curPhi) * Math.cos(curTheta);
    camera.position.y = camTarget.y + curRadius * Math.cos(curPhi);
    camera.position.z = camTarget.z + curRadius * Math.sin(curPhi) * Math.sin(curTheta);
    camera.lookAt(camTarget);

    particles.rotation.y += 0.001;

    const red = vehiclesData.find(v => v.c === 0xff2222);
    if (red) {
      if (!isWon) {
        red.mesh.position.y = Math.sin(Date.now() * 0.005) * 0.1;
      } else {
        const el = (Date.now() - winTime) / 1000;
        winBeam.material.opacity = Math.min(0.8, el * 0.5);
        winGlow.material.opacity = Math.min(1, el);
        winLight.intensity = Math.min(20, el * 10);
        red.mesh.position.y += 0.15;
        red.mesh.rotation.y += 0.1;
      }
    }
    renderer.render(scene, camera);
  }
  init();
</script>
</body>
</html>
